<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ferrari</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: black;
      color: white;
      overflow-x: hidden;
      overflow-y: hidden; /* Bloquea scroll mientras el video se reproduce */
    }

    .background-image {
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      transition: filter 0.5s ease;
    }

    main,
    .estilos {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    main.visible,
    .estilos.visible-content {
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
    }

    main {
      height: 300dvh;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding-top: 20px;
      animation: slideInDown 1500ms ease-out;
      perspective: 1000px;
      position: relative;
      z-index: 1;
    }

    header img {
      width: 130px;
      height: auto;
      animation: rotate3d 5s linear infinite;
      transform-style: preserve-3d;
      position: relative;
      z-index: 2;
    }

    @keyframes rotate3d {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    @keyframes slideInDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .estilos {
      position: fixed;
      top: 0;
      left: 0;
      width: 50vw;
      height: 100vh;
      background: rgba(10, 10, 10, 0.95);
      padding: 20px 40px 40px 40px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      transform: translateX(-100%);
      transition: transform 1s ease;
      overflow-y: auto;
    }

    .estilos.visible {
      transform: translateX(0%);
    }

    .estilos header {
      position: sticky;
      top: 0;
      background: rgba(10, 10, 10, 0.95);
      padding: 10px 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #ff0000;
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 110px;
    }

    .estilos header img {
      width: 80px;
      height: auto;
      filter: brightness(0) saturate(100%) invert(1);
      animation: rotate3d 5s linear infinite;
      transform-style: preserve-3d;
    }

    .estilos h2 {
      font-size: 32px;
      margin-bottom: 30px;
      color: #ff0000;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .estilos button {
      width: 100%;
      background: #111;
      border: 2px solid #ff0000;
      color: #fff;
      font-size: 18px;
      padding: 15px 25px;
      margin-bottom: 15px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
    }

    .estilos button:hover {
      background: #ff0000;
      transform: scale(1.05);
    }

    .mensaje-estilo {
      margin-top: 20px;
      font-size: 16px;
      color: #ccc;
      min-height: 30px;
    }

    /* VIDEO INTRO */
    #introVideoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease;
    }

    #introVideoContainer.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #introVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <!-- VIDEO INTRO -->
  <div id="introVideoContainer">
    <video id="introVideo" src="intro.mp4" autoplay muted playsinline></video>
  </div>

  <main id="mainContent">
    <header>
      <img src="logo.png" alt="Ichiban - Your Way to Freedom" />
    </header>
  </main>

  <div class="estilos" id="estilosBox">
    <header>
      <img src="logo.png" alt="Logo blanco giratorio" />
    </header>

    <h2>Descubre tu estilo en ropa urbana</h2>

    <button onclick="location.href='sudaderas.html'">Sudaderas Clásicas</button>
    <button onclick="location.href='zapatillas.html'">Zapatillas Urbanas</button>
    <button onclick="location.href='edicion-limitada.html'">Edición Limitada</button>
    <button onclick="location.href='accesorios.html'">Accesorios</button>

    <div class="mensaje-estilo" id="mensajeEstilo"></div>
  </div>

  <script type="module">
    import { images } from './images.js';

    // ¡Aquí la clave! Forzar scroll arriba nada más cargar la página para evitar que recuerde scroll abajo
    window.scrollTo(0, 0);

    const main = document.querySelector('main');
    const MAX_FRAMES = images.length;
    let currentFrame = 0;

    const bgImg = document.createElement('img');
    bgImg.classList.add('background-image');
    main.appendChild(bgImg);

    function updateImage(frame = 0) {
      if (images[frame]) {
        bgImg.src = images[frame].p;
      }
    }

    updateImage(currentFrame);

    let maxScroll = document.documentElement.scrollHeight - window.innerHeight;

    window.addEventListener('resize', () => {
      maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    });

    let lastFrameUpdate = 0;
    let estilosMostrado = false;

    window.addEventListener('scroll', () => {
      if (Date.now() - lastFrameUpdate < 1) return;
      lastFrameUpdate = Date.now();

      const scrollPosition = window.scrollY;
      const scrollFraction = scrollPosition / maxScroll;
      const frame = Math.floor(scrollFraction * MAX_FRAMES);

      if (currentFrame !== frame && images[frame]) {
        updateImage(frame);
        currentFrame = frame;
      }

      const estilosBox = document.getElementById('estilosBox');

      if (!estilosMostrado && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10) {
        estilosBox.classList.add('visible');
        bgImg.style.filter = 'brightness(0.3)';
        estilosMostrado = true;
      }
    });

    let autoScrollActive = true;
    function autoScroll() {
      if (!autoScrollActive) return;
      const isAtBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight;
      if (!isAtBottom) {
        window.scrollBy({ top: 300, behavior: 'smooth' });
        requestAnimationFrame(autoScroll);
      }
    }

    window.addEventListener('wheel', () => autoScrollActive = false, { once: true });
    window.addEventListener('touchstart', () => autoScrollActive = false, { once: true });

    // Mensaje de estilo
    const botones = document.querySelectorAll('.estilos button');
    const mensaje = document.getElementById('mensajeEstilo');
    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        mensaje.textContent = btn.dataset.msg || '';
      });
    });

    // VIDEO INTRO & TRANSICIÓN
    const introContainer = document.getElementById('introVideoContainer');
    const introVideo = document.getElementById('introVideo');
    const mainContent = document.getElementById('mainContent');
    const estilosBox = document.getElementById('estilosBox');

    introVideo.onended = () => {
      introContainer.classList.add('fade-out');
      setTimeout(() => {
        // Habilita scroll
        document.body.style.overflowY = 'auto';

        // Muestra contenido
        mainContent.classList.add('visible');
        estilosBox.classList.add('visible-content');

        // Forzar reflow para actualizar scrollHeight
        void document.body.offsetHeight;

        // Forzar pequeño scroll 1px para desbloquear scroll
        window.scrollTo(0, 1);

        // Vuelve a posición 0 para iniciar scroll desde arriba
        window.scrollTo(0, 0);

        // Ahora iniciar scroll automático
        autoScroll();

      }, 1000);
    };
  </script>

</body>
</html>
