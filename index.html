<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferrari</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .background-image {
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    main {
      height: 300dvh;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding-top: 20px;
      animation: slideInDown 1500ms ease-out;
      perspective: 1000px;
      position: relative;
      z-index: 1;
    }

    header img {
      width: 130px;
      height: auto;
      margin: 0;
      animation: rotate3d 5s linear infinite;
      transform-style: preserve-3d;
      position: relative;
      z-index: 2;
    }

    @keyframes rotate3d {
      from {
        transform: rotateY(0deg);
      }

      to {
        transform: rotateY(360deg);
      }
    }

    @keyframes slideInDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <img src="logo.png" alt="Ichiban - Your Way to Freedom" />
    </header>
  </main>

  <script type="module">
    import { images } from './images.js';

    const main = document.querySelector('main');
    const MAX_FRAMES = images.length;
    let currentFrame = 0;

    const img = document.createElement('img');
    img.classList.add('background-image');
    main.appendChild(img);

    function updateImage(frame = 0) {
      if (images[frame]) {
        img.src = images[frame].p;
      }
    }

    updateImage(currentFrame);

    let maxScroll = document.documentElement.scrollHeight - window.innerHeight;

    window.addEventListener('resize', () => {
      maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    });

    let lastFrameUpdate = 0;

    window.addEventListener('scroll', () => {
      if (Date.now() - lastFrameUpdate < 1) return;
      lastFrameUpdate = Date.now();

      const scrollPosition = window.scrollY;
      const scrollFraction = scrollPosition / maxScroll;
      const frame = Math.floor(scrollFraction * MAX_FRAMES);

      if (currentFrame !== frame && images[frame]) {
        updateImage(frame);
        currentFrame = frame;
      }
    });

    // Scroll automático fluido con retraso de 5 segundos
    let autoScrollActive = true;

    function autoScroll() {
      if (!autoScrollActive) return;

      const isAtBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight;

      if (!isAtBottom) {
        window.scrollBy({ top: 300, behavior: 'smooth' }); // Scroll rápido y suave
        requestAnimationFrame(autoScroll);
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        autoScroll();
      }, 2500); // Espera 5 segundos (5000 ms)
    });

    // Cancelar scroll automático si el usuario interactúa
    window.addEventListener('wheel', () => {
      autoScrollActive = false;
    }, { once: true });

    window.addEventListener('touchstart', () => {
      autoScrollActive = false;
    }, { once: true });
  </script>
</body>

</html>
