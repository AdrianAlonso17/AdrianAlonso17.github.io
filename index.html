<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferrari</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background-color: black;
      color: white;
    }

    .background-image {
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      transition: filter 0.5s ease;
    }

    main {
      height: 300dvh;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding-top: 20px;
      animation: slideInDown 1500ms ease-out;
      perspective: 1000px;
      position: relative;
      z-index: 1;
    }

    header img {
      width: 130px;
      height: auto;
      animation: rotate3d 5s linear infinite;
      transform-style: preserve-3d;
      position: relative;
      z-index: 2;
    }

    @keyframes rotate3d {
      from {
        transform: rotateY(0deg);
      }

      to {
        transform: rotateY(360deg);
      }
    }

    @keyframes slideInDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Caja de estilo lateral */
    .estilos {
      position: fixed;
      left: 30px;
      bottom: 50px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 20px 25px;
      border-radius: 12px;
      border: 1px solid #f00;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .estilos.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .estilos h2 {
      margin: 0 0 10px;
      font-size: 18px;
      color: #f00;
    }

    .estilos button {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      background: none;
      border: 1px solid #f00;
      color: #fff;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .estilos button:hover {
      background: #f00;
      transform: scale(1.05);
    }

    .mensaje-estilo {
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <img src="logo.png" alt="Ichiban - Your Way to Freedom" />
    </header>
  </main>

  <div class="estilos" id="estilosBox">
    <h2>Elige tu estilo Ferrari</h2>
    <button data-msg="Lujo y clase en cada curva.">Elegancia</button>
    <button data-msg="Potencia brutal y velocidad máxima.">Deportivo</button>
    <button data-msg="Estilo urbano con alma de carreras.">Urbano</button>
    <button data-msg="Tecnología que desafía el futuro.">Futurista</button>
    <div class="mensaje-estilo" id="mensajeEstilo"></div>
  </div>

  <script type="module">
    import { images } from './images.js';

    const main = document.querySelector('main');
    const MAX_FRAMES = images.length;
    let currentFrame = 0;

    const img = document.createElement('img');
    img.classList.add('background-image');
    main.appendChild(img);

    function updateImage(frame = 0) {
      if (images[frame]) {
        img.src = images[frame].p;
      }
    }

    updateImage(currentFrame);

    let maxScroll = document.documentElement.scrollHeight - window.innerHeight;

    window.addEventListener('resize', () => {
      maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    });

    let lastFrameUpdate = 0;

    window.addEventListener('scroll', () => {
      if (Date.now() - lastFrameUpdate < 1) return;
      lastFrameUpdate = Date.now();

      const scrollPosition = window.scrollY;
      const scrollFraction = scrollPosition / maxScroll;
      const frame = Math.floor(scrollFraction * MAX_FRAMES);

      if (currentFrame !== frame && images[frame]) {
        updateImage(frame);
        currentFrame = frame;
      }

      // Mostrar caja cuando estamos cerca del fondo
      const estilosBox = document.getElementById('estilosBox');
      if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10) {
        estilosBox.classList.add('visible');
      }
    });

    // Scroll automático fluido con retraso de 2.5 segundos
    let autoScrollActive = true;

    function autoScroll() {
      if (!autoScrollActive) return;

      const isAtBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight;

      if (!isAtBottom) {
        window.scrollBy({ top: 400, behavior: 'smooth' });
        requestAnimationFrame(autoScroll);
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        autoScroll();
      }, 2500); // Espera 2.5 segundos
    });

    window.addEventListener('wheel', () => {
      autoScrollActive = false;
    }, { once: true });

    window.addEventListener('touchstart', () => {
      autoScrollActive = false;
    }, { once: true });

    // Mensajes al seleccionar estilo
    const botones = document.querySelectorAll('.estilos button');
    const mensaje = document.getElementById('mensajeEstilo');
    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        mensaje.textContent = btn.dataset.msg;
      });
    });
  </script>
</body>

</html>
