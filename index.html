<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ferrari</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: black;
      color: white;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      width: 100%;
      height: 60px;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 20;
      box-shadow: 0 2px 6px rgba(255, 0, 0, 0.5);
    }

    header img {
      width: 130px;
      height: auto;
      animation: rotate3d 5s linear infinite;
      transform-style: preserve-3d;
      position: relative;
      z-index: 21;
    }

    @keyframes rotate3d {
      from {
        transform: rotateY(0deg);
      }

      to {
        transform: rotateY(360deg);
      }
    }

    main {
      margin-top: 60px; /* para que no quede bajo el header */
      display: flex;
      height: calc(100vh - 60px); /* resto altura header */
      width: 100%;
    }

    section.estilos {
      position: fixed;
      top: 60px; /* justo debajo del header */
      left: 0;
      width: 50vw;
      height: calc(100vh - 60px);
      background: rgba(10, 10, 10, 0.95);
      padding: 60px 40px 40px 40px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow-y: auto;
      z-index: 10;
    }

    section.estilos h2 {
      font-size: 32px;
      margin-bottom: 30px;
      color: #ff0000;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    section.estilos button {
      background: #111;
      border: 2px solid #ff0000;
      color: #fff;
      font-size: 18px;
      padding: 15px 25px;
      margin-bottom: 15px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
    }

    section.estilos button:hover {
      background: #ff0000;
      color: #fff;
      transform: scale(1.05);
    }

    .mensaje-estilo {
      margin-top: 20px;
      font-size: 16px;
      color: #ccc;
      min-height: 30px;
      max-width: 90%;
    }

    /* Contenedor derecho para más contenido (vacío por ahora) */
    .contenido-derecha {
      margin-left: 50vw;
      padding: 20px;
      flex-grow: 1;
      background: transparent;
      color: white;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <header>
    <img src="logo.png" alt="Ichiban - Your Way to Freedom" />
  </header>

  <main>
    <section class="estilos" id="estilosBox">
      <h2>Descubre tu estilo en ropa urbana</h2>

      <button onclick="location.href='sudaderas.html'">
        Sudaderas Clásicas
      </button>

      <button onclick="location.href='zapatillas.html'">
        Zapatillas Urbanas
      </button>

      <button onclick="location.href='edicion-limitada.html'">
        Edición Limitada
      </button>

      <button onclick="location.href='accesorios.html'">
        Accesorios
      </button>

      <div class="mensaje-estilo" id="mensajeEstilo"></div>
    </section>

    <div class="contenido-derecha">
      <!-- Aquí puedes añadir contenido a la derecha -->
    </div>
  </main>

  <script type="module">
    import { images } from './images.js';

    const main = document.querySelector('main');
    const MAX_FRAMES = images.length;
    let currentFrame = 0;

    const img = document.createElement('img');
    img.classList.add('background-image');
    main.appendChild(img);

    function updateImage(frame = 0) {
      if (images[frame]) {
        img.src = images[frame].p;
      }
    }

    updateImage(currentFrame);

    let maxScroll = document.documentElement.scrollHeight - window.innerHeight;

    window.addEventListener('resize', () => {
      maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    });

    let lastFrameUpdate = 0;
    let estilosMostrado = false;

    window.addEventListener('scroll', () => {
      if (Date.now() - lastFrameUpdate < 1) return;
      lastFrameUpdate = Date.now();

      const scrollPosition = window.scrollY;
      const scrollFraction = scrollPosition / maxScroll;
      const frame = Math.floor(scrollFraction * MAX_FRAMES);

      if (currentFrame !== frame && images[frame]) {
        updateImage(frame);
        currentFrame = frame;
      }

      const estilosBox = document.getElementById('estilosBox');

      if (!estilosMostrado && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10) {
        estilosBox.classList.add('visible');
        img.style.filter = 'brightness(0.3)';
        estilosMostrado = true;
      }
    });

    // Scroll automático
    let autoScrollActive = true;

    function autoScroll() {
      if (!autoScrollActive) return;

      const isAtBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight;

      if (!isAtBottom) {
        window.scrollBy({ top: 300, behavior: 'smooth' });
        requestAnimationFrame(autoScroll);
      }
    }

    window.addEventListener('load', () => {
      setTimeout(() => {
        autoScroll();
      }, 2500);
    });

    window.addEventListener('wheel', () => {
      autoScrollActive = false;
    }, { once: true });

    window.addEventListener('touchstart', () => {
      autoScrollActive = false;
    }, { once: true });

    // Mensaje de estilo
    const botones = document.querySelectorAll('.estilos button');
    const mensaje = document.getElementById('mensajeEstilo');
    botones.forEach(btn => {
      btn.addEventListener('click', () => {
        mensaje.textContent = btn.dataset.msg || '';
      });
    });
  </script>
</body>

</html>
