<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ferrari</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: black;
      color: white;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    .background-image {
      width: 100vw;
      height: 100dvh;
      object-fit: cover;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      transition: filter 0.5s ease;
    }

    main,
    .estilos {
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    main.visible,
    .estilos.visible-content {
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
    }

    main {
      height: 300dvh;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      padding-top: 20px;
      animation: slideInDown 1500ms ease-out;
      perspective: 1000px;
      position: relative;
      z-index: 1;
    }

    header img {
      width: 130px;
      height: auto;
      animation: rotate3d 5s linear infinite;
      transform-style: preserve-3d;
      position: relative;
      z-index: 2;
    }

    @keyframes rotate3d {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    @keyframes slideInDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .estilos {
      position: fixed;
      top: 0;
      left: 0;
      width: 50vw;
      height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      z-index: 10;
      transform: translateX(-100%);
      transition: transform 1s ease;
      overflow-y: auto;

    }

    .estilos.visible {
      transform: translateX(0%);
    }

    .estilos header {
      position: sticky;
      top: 0;
      padding: 10px 0;
      margin-bottom: 20px;
      border-bottom: 2px solid white;
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100px;
    }

    .estilos header img {
      width: 80px;
      height: auto;
      filter: brightness(0) invert(1);
      animation: rotate3d 5s linear infinite;
      transform-style: preserve-3d;
    }

    .estilos h2 {
      font-size: 28px;
      margin-bottom: 20px;
      color: white;
      text-align: center;
    }

    .carousel {
      display: flex;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .carousel-inner {
      display: flex;
      transition: transform 0.5s ease;
      width: 100%;
    }

    .carousel-item {
      min-width: 100%;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
      background: #fff;
      color: #000;
      border-radius: 12px;
    }

    .carousel-item img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .carousel-item p {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .carousel-item button {
      background: black;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .mensaje-estilo {
      margin-top: 20px;
      font-size: 16px;
      color: #ccc;
      min-height: 30px;
      text-align: center;
    }

    #introVideoContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease;
    }

    #introVideoContainer.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #introVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      #introVideo {
        object-fit: contain;
        transform: scale(0.9);
      }

      .estilos {
        width: 100vw;
      }

      .carousel-item p {
        font-size: 14px;
      }

      .carousel-item button {
        font-size: 14px;
      }

      .estilos h2 {
        font-size: 22px;
      }
    }


  </style>
</head>

<body>
  <div id="introVideoContainer">
    <video id="introVideo" src="intro.mp4" autoplay muted playsinline></video>
  </div>

  <main id="mainContent"></main>

  <div class="estilos" id="estilosBox">
    <header>
      <img src="logo.png" alt="Logo blanco giratorio" />
    </header>
    <div class="carousel">
      <div class="carousel-inner" id="carouselInner">
        <div class="carousel-item">
          <img src="logo.png" alt="Sudaderas">
          <p>Sudaderas urbanas con diseños clásicos que nunca fallan.</p>
          <button onclick="location.href='sudaderas.html'">Ver Sudaderas</button>
        </div>
        <div class="carousel-item">
          <img src="logo.png" alt="Zapatillas">
          <p>Zapatillas con estilo callejero y comodidad para todo el día.</p>
          <button onclick="location.href='zapatillas.html'">Ver Zapatillas</button>
        </div>
        <div class="carousel-item">
          <img src="logo.png" alt="Edición limitada">
          <p>Prendas únicas de edición limitada. Solo para los más rápidos.</p>
          <button onclick="location.href='edicion-limitada.html'">Ver Edición Limitada</button>
        </div>
        <div class="carousel-item">
          <img src="logo.png" alt="Accesorios">
          <p>Accesorios para completar tu estilo urbano al máximo.</p>
          <button onclick="location.href='accesorios.html'">Ver Accesorios</button>
        </div>
      </div>
    </div>

    <div class="mensaje-estilo" id="mensajeEstilo"></div>
  </div>

  <script type="module">
    import { images } from './images.js';

    window.scrollTo(0, 0);

    const main = document.querySelector('main');
    const MAX_FRAMES = images.length;
    let currentFrame = 0;

    const bgImg = document.createElement('img');
    bgImg.classList.add('background-image');
    main.appendChild(bgImg);

    function updateImage(frame = 0) {
      if (images[frame]) {
        bgImg.src = images[frame].p;
      }
    }

    updateImage(currentFrame);

    let maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    window.addEventListener('resize', () => {
      maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    });

    let lastFrameUpdate = 0;
    let estilosMostrado = false;

    window.addEventListener('scroll', () => {
      if (Date.now() - lastFrameUpdate < 1) return;
      lastFrameUpdate = Date.now();

      const scrollPosition = window.scrollY;
      const scrollFraction = scrollPosition / maxScroll;
      const frame = Math.floor(scrollFraction * MAX_FRAMES);

      if (currentFrame !== frame && images[frame]) {
        updateImage(frame);
        currentFrame = frame;
      }

      const estilosBox = document.getElementById('estilosBox');
      if (!estilosMostrado && window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 10) {
        estilosBox.classList.add('visible');
        bgImg.style.filter = 'brightness(0.3)';
        estilosMostrado = true;
      }
    });

    let autoScrollActive = true;
    function autoScroll() {
  if (!autoScrollActive) return;
  const atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight;
  if (!atBottom) {
    window.scrollBy(0, 60); // movimiento más suave y constante
    setTimeout(autoScroll, 16); // ~60 FPS, más fiable en móviles que requestAnimationFrame
  }
}


    window.addEventListener('wheel', () => autoScrollActive = false, { once: true });
    window.addEventListener('touchstart', () => autoScrollActive = false, { once: true });

    // Carrusel automático
    const carouselInner = document.getElementById('carouselInner');
    let currentIndex = 0;
    const totalItems = carouselInner.children.length;

    setInterval(() => {
      currentIndex = (currentIndex + 1) % totalItems;
      carouselInner.style.transform = `translateX(-${currentIndex * 100}%)`;
    }, 4000); // cada 4 segundos

    const introContainer = document.getElementById('introVideoContainer');
    const introVideo = document.getElementById('introVideo');
    const mainContent = document.getElementById('mainContent');
    const estilosBox = document.getElementById('estilosBox');

    introVideo.onended = () => {
      introContainer.classList.add('fade-out');
      setTimeout(() => {
        document.body.style.overflowY = 'auto';
        mainContent.classList.add('visible');
        estilosBox.classList.add('visible-content');
        void document.body.offsetHeight;
        window.scrollTo(0, 1);
        window.scrollTo(0, 0);
        autoScroll();
      }, 1000);
    };
  </script>
</body>
</html>
